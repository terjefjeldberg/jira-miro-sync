name: Add custom card position diagnostics once

on:
  push:
    branches:
      - fix/custom-card-single-item
    paths:
      - .github/workflows/add-position-debug-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-card-single-item

      - name: Add parked diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')

          marker = '''        // Keep the active-board safety rule for every custom card.\n        // Image cards may be children of a frame, so currentX/currentY\n        // above are first resolved to absolute canvas coordinates.\n        if (\n          !insideActiveBoard(\n            currentX,\n            currentY\n          )\n        ) {\n\n          return {\n\n            ok:\n              true,\n\n            mapped:\n              true,\n\n            moved:\n              false,\n\n            parked:\n              true\n\n          };\n\n        }\n'''

          replacement = '''        // Keep the active-board safety rule for every custom card.\n        // Image cards may be children of a frame, so currentX/currentY\n        // above are first resolved to absolute canvas coordinates.\n        if (\n          !insideActiveBoard(\n            currentX,\n            currentY\n          )\n        ) {\n\n          return {\n\n            ok:\n              true,\n\n            mapped:\n              true,\n\n            moved:\n              false,\n\n            parked:\n              true,\n\n            debugPosition: {\n              resolvedX:\n                currentX,\n              resolvedY:\n                currentY,\n              rawX:\n                frameItem.position?.x ?? null,\n              rawY:\n                frameItem.position?.y ?? null,\n              relativeTo:\n                frameItem.position?.relativeTo ?? null,\n              parentId:\n                frameItem.parent?.id ?? null,\n              boardLeft:\n                ACTIVE_BOARD.left,\n              boardRight:\n                ACTIVE_BOARD.right,\n              boardTop:\n                ACTIVE_BOARD.top,\n              boardBottom:\n                ACTIVE_BOARD.bottom\n            }\n\n          };\n\n        }\n'''

          if marker not in text:
              raise SystemExit('Expected custom parked block not found')

          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check src/worker.js

      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-position-debug-once.yml
          git add src/worker.js .github/workflows/add-position-debug-once.yml
          git commit -m "Add custom card position diagnostics"
          git push origin HEAD:fix/custom-card-single-item
