name: Fix live Jira status and image positioning once

on:
  push:
    branches:
      - fix/custom-card-single-item
    paths:
      - .github/workflows/fix-live-status-and-image-parent-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-card-single-item

      - name: Patch worker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')

          old_status = '''      const status =\n        String(\n          body.status ??\n          ""\n        ).trim();\n'''

          new_status = '''      let status =\n        String(\n          body.status ??\n          ""\n        ).trim();\n\n\n      // Jira Automation can occasionally expose the pre-transition\n      // status in the webhook smart value. Always resolve the current\n      // Jira status server-side so Jira -> Miro uses the actual state.\n      try {\n\n        const liveStatusResponse =\n          await fetch(\n\n            jiraApiBase +\n            "/issue/" +\n            encodeURIComponent(\n              issueKey\n            ) +\n            "?fields=status",\n\n            {\n              method:\n                "GET",\n\n              headers:\n                jiraHeaders\n            }\n\n          );\n\n\n        if (\n          liveStatusResponse.ok\n        ) {\n\n          const liveStatusData =\n            await liveStatusResponse.json();\n\n          const liveStatus =\n            String(\n              liveStatusData.fields\n                ?.status\n                ?.name ??\n              ""\n            ).trim();\n\n          if (\n            liveStatus\n          ) {\n            status =\n              liveStatus;\n          }\n\n        }\n\n      } catch (\n        liveStatusError\n      ) {\n\n        console.warn(\n          "JIRA -> MIRO: could not refresh live Jira status; using webhook status",\n          liveStatusError\n        );\n\n      }\n'''

          if old_status not in text:
              raise SystemExit('Could not find webhook status block')
          text = text.replace(old_status, new_status, 1)

          marker = '''      async function moveCustomFrame(\n        frameId,\n        frameItem\n      ) {\n'''
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('Could not find moveCustomFrame')

          tail = text[idx:]
          old_park = '''        if (\n          !insideActiveBoard(\n            currentX,\n            currentY\n          )\n        ) {\n\n          return {\n\n            ok:\n              true,\n\n            mapped:\n              true,\n\n            moved:\n              false,\n\n            parked:\n              true\n\n          };\n\n        }\n'''

          new_park = '''        // Image-based custom cards can be children of a Miro frame.\n        // In that case REST x/y coordinates are parent-relative rather\n        // than canvas-relative, so the generic active-board parking\n        // check incorrectly marks a visible card as parked. Exact KV\n        // mapping makes it safe to move this single image item directly.\n        if (\n          frameItem.type !== "image" &&\n          !insideActiveBoard(\n            currentX,\n            currentY\n          )\n        ) {\n\n          return {\n\n            ok:\n              true,\n\n            mapped:\n              true,\n\n            moved:\n              false,\n\n            parked:\n              true\n\n          };\n\n        }\n'''

          if old_park not in tail:
              raise SystemExit('Could not find custom parked block')
          tail = tail.replace(old_park, new_park, 1)
          text = text[:idx] + tail

          # For mapped image cards, detach from any parent frame while moving.
          old_patch = '''        const patchResponse =\n          await patchMiroItemPosition(\n\n            frameId,\n\n            targetColumn.targetX,\n\n            currentY\n\n          );\n'''

          new_patch = '''        let patchResponse;\n\n\n        if (\n          frameItem.type === "image"\n        ) {\n\n          patchResponse =\n            await fetch(\n\n              boardItemsBase +\n              encodeURIComponent(\n                frameId\n              ),\n\n              {\n                method:\n                  "PATCH",\n\n                headers: {\n                  ...miroHeaders,\n                  "Content-Type":\n                    "application/json"\n                },\n\n                body:\n                  JSON.stringify({\n                    parent: {\n                      id:\n                        null\n                    },\n                    position: {\n                      x:\n                        targetColumn.targetX,\n                      y:\n                        currentY,\n                      origin:\n                        "center"\n                    }\n                  })\n              }\n\n            );\n\n        } else {\n\n          patchResponse =\n            await patchMiroItemPosition(\n\n              frameId,\n\n              targetColumn.targetX,\n\n              currentY\n\n            );\n\n        }\n'''

          if old_patch not in tail:
              raise SystemExit('Could not find custom patch block')
          tail = tail.replace(old_patch, new_patch, 1)
          text = text[:idx] + tail

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check src/worker.js

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-live-status-and-image-parent-once.yml
          git add src/worker.js .github/workflows/fix-live-status-and-image-parent-once.yml
          git commit -m "Fix live Jira status and mapped image positioning"
          git push origin HEAD:fix/custom-card-single-item
