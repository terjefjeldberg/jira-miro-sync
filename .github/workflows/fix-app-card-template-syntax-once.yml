name: Fix App Card template syntax once

on:
  push:
    branches:
      - fix/custom-card-single-item
    paths:
      - .github/workflows/fix-app-card-template-syntax-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-card-single-item

      - name: Fix template-literal backticks and verify syntax
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')

          old = '// code. `frame` now points to the single App Card item.'
          new = '// code. The frame property now points to the single App Card item.'

          if old not in text:
              raise SystemExit('Expected App Card return-shape comment was not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check src/worker.js

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-app-card-template-syntax-once.yml
          git add src/worker.js .github/workflows/fix-app-card-template-syntax-once.yml
          git commit -m "Fix App Card template literal syntax"
          git push origin HEAD:fix/custom-card-single-item
