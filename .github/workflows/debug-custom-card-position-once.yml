name: Add custom card position diagnostics once

on:
  push:
    branches:
      - fix/custom-card-single-item
    paths:
      - .github/workflows/debug-custom-card-position-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-card-single-item

      - name: Add parked-position diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')

          old = '''            parked:\n              true\n\n          };'''

          new = '''            parked:\n              true,\n\n            debugPosition: {\n              resolvedX:\n                currentX,\n              resolvedY:\n                currentY,\n              rawX:\n                frameItem.position?.x ?? null,\n              rawY:\n                frameItem.position?.y ?? null,\n              relativeTo:\n                frameItem.position?.relativeTo ?? null,\n              parentId:\n                frameItem.parent?.id ?? null,\n              boardLeft:\n                ACTIVE_BOARD.left,\n              boardRight:\n                ACTIVE_BOARD.right,\n              boardTop:\n                ACTIVE_BOARD.top,\n              boardBottom:\n                ACTIVE_BOARD.bottom\n            }\n\n          };'''

          # Replace only the parked response inside moveCustomFrame.
          start = text.index('      async function moveCustomFrame(')
          end = text.index('      async function moveLegacyCustomGroup(', start)
          block = text[start:end]
          if old not in block:
              raise SystemExit('Expected parked response not found in moveCustomFrame')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check src/worker.js

      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/debug-custom-card-position-once.yml
          git add src/worker.js .github/workflows/debug-custom-card-position-once.yml
          git commit -m "Expose custom card canvas-position diagnostics"
          git push origin HEAD:fix/custom-card-single-item
