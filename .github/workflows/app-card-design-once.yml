name: Apply App Card design refinement once

on:
  push:
    branches:
      - fix/custom-card-single-item
    paths:
      - .github/workflows/app-card-design-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-card-single-item

      - name: Refine App Card colors and fields
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')

          old = '''    const fields = [\n\n      {\n        value:\n          jira.issueKey,\n\n        tooltip:\n          "Jira issue"\n      },\n\n      {\n        value:\n          jira.priority,\n\n        tooltip:\n          "Priority"\n      },\n\n      {\n        value:\n          jira.assignee,\n\n        tooltip:\n          "Assignee"\n      }\n\n    ];'''

          new = '''    // App Cards apply Miro's own rendering on top of the theme color.\n    // Use a stronger work-type theme here so the issue type remains obvious\n    // while preserving the original custom-card palette for legacy frames.\n    const APP_CARD_WORK_TYPE_COLORS = {\n\n      bug:\n        "#F45BD3",\n\n      improvement:\n        "#6FA8FF",\n\n      spike:\n        "#FFD84D",\n\n      "new feature":\n        "#9FE04F",\n\n      "hotfix candidate":\n        "#FF914D",\n\n      "task/config/doc/test":\n        "#4FD7CD"\n\n    };\n\n\n    const appCardTheme =\n      APP_CARD_WORK_TYPE_COLORS[\n        String(\n          jira.workType ?? ""\n        )\n          .trim()\n          .toLowerCase()\n      ]\n      ||\n      cardColor;\n\n\n    const fieldFillColor =\n      cardColor;\n\n\n    const fields = [\n\n      {\n        value:\n          jira.issueKey,\n\n        fillColor:\n          fieldFillColor,\n\n        textColor:\n          "#1A1A1A",\n\n        tooltip:\n          "Jira issue"\n      },\n\n      {\n        value:\n          jira.priority,\n\n        fillColor:\n          fieldFillColor,\n\n        textColor:\n          "#1A1A1A",\n\n        tooltip:\n          "Priority"\n      },\n\n      {\n        value:\n          jira.assignee,\n\n        fillColor:\n          fieldFillColor,\n\n        textColor:\n          "#1A1A1A",\n\n        tooltip:\n          "Assignee"\n      }\n\n    ];'''

          if old not in text:
              raise SystemExit('Expected App Card fields block was not found')

          text = text.replace(old, new, 1)

          old_theme = '''          cardTheme:\n            cardColor,'''
          new_theme = '''          cardTheme:\n            appCardTheme,'''

          if old_theme not in text:
              raise SystemExit('Expected App Card theme block was not found')

          text = text.replace(old_theme, new_theme, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check src/worker.js

      - name: Commit design refinement and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/app-card-design-once.yml
          git add src/worker.js .github/workflows/app-card-design-once.yml
          git commit -m "Strengthen App Card work-type colors"
          git push origin HEAD:fix/custom-card-single-item
