name: Apply grouped custom card migration once

on:
  push:
    branches:
      - fix/custom-card-single-item
    paths:
      - .github/workflows/group-card-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-card-single-item

      - name: Convert new custom cards to grouped classic design
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/worker.js')
          text = path.read_text(encoding='utf-8')

          # 1) Replace sticky conversion App Card creation with the classic
          # visual design, grouped into one Miro group for selection/dragging.
          pattern = re.compile(
              r'  async function createCustomCardAt\(\n    jira,\n    x,\n    y\n  \) \{.*?\n  \}\n\n\n  // ========================================================\n  // STICKY -> CUSTOM CARD POSITION',
              re.S,
          )

          replacement = '''  async function createCustomCardAt(\n    jira,\n    x,\n    y\n  ) {\n\n    const width =\n      320;\n\n    const height =\n      120;\n\n\n    const cardColor =\n      customCardColorForWorkType(\n        jira.workType\n      );\n\n\n    const createdItems =\n      [];\n\n\n    let group =\n      null;\n\n\n    try {\n\n      const background =\n        await miro.board.createShape({\n\n          shape:\n            "rectangle",\n\n          x,\n\n          y,\n\n          width,\n\n          height,\n\n          style: {\n\n            fillColor:\n              cardColor,\n\n            fillOpacity:\n              1,\n\n            borderOpacity:\n              0,\n\n            borderWidth:\n              0\n\n          }\n\n        });\n\n\n      createdItems.push(\n        background\n      );\n\n\n      const issueKeyText =\n        await miro.board.createText({\n\n          content:\n            "<strong>" +\n            escapeHtml(\n              jira.issueKey\n            ) +\n            "</strong>",\n\n          x:\n            x - 122,\n\n          y:\n            y - 45,\n\n          width:\n            60,\n\n          style: {\n\n            color:\n              "#1A1A1A",\n\n            fillColor:\n              "transparent",\n\n            fontFamily:\n              "arial",\n\n            fontSize:\n              10,\n\n            textAlign:\n              "left"\n\n          }\n\n        });\n\n\n      createdItems.push(\n        issueKeyText\n      );\n\n\n      const jiraLinkText =\n        await miro.board.createText({\n\n          content:\n            '<a href="' +\n            escapeHtml(\n              jira.browseUrl\n            ) +\n            '">Jira ↗</a>',\n\n          linkedTo:\n            jira.browseUrl,\n\n          x:\n            x + 112,\n\n          y:\n            y - 45,\n\n          width:\n            70,\n\n          style: {\n\n            color:\n              "#1A1A1A",\n\n            fillColor:\n              "transparent",\n\n            fontFamily:\n              "arial",\n\n            fontSize:\n              10,\n\n            textAlign:\n              "right"\n\n          }\n\n        });\n\n\n      createdItems.push(\n        jiraLinkText\n      );\n\n\n      const summaryText =\n        await miro.board.createText({\n\n          content:\n            "<strong>" +\n            escapeHtml(\n              jira.summary\n            ) +\n            "</strong>",\n\n          x,\n\n          y:\n            y - 10,\n\n          width:\n            280,\n\n          style: {\n\n            color:\n              "#1A1A1A",\n\n            fillColor:\n              "transparent",\n\n            fontFamily:\n              "arial",\n\n            fontSize:\n              titleFontSize(\n                jira.summary\n              ),\n\n            textAlign:\n              "left"\n\n          }\n\n        });\n\n\n      createdItems.push(\n        summaryText\n      );\n\n\n      const priorityIcon =\n        await createPriorityIcon(\n\n          jira,\n\n          x - 138,\n\n          y + 42\n\n        );\n\n\n      if (\n        priorityIcon\n      ) {\n\n        createdItems.push(\n          priorityIcon\n        );\n\n      }\n\n\n      const priorityText =\n        await miro.board.createText({\n\n          content:\n            escapeHtml(\n              jira.priority\n            ),\n\n          x:\n            x - 72,\n\n          y:\n            y + 42,\n\n          width:\n            94,\n\n          style: {\n\n            color:\n              "#1A1A1A",\n\n            fillColor:\n              "transparent",\n\n            fontFamily:\n              "arial",\n\n            fontSize:\n              10,\n\n            textAlign:\n              "left"\n\n          }\n\n        });\n\n\n      createdItems.push(\n        priorityText\n      );\n\n\n      const assigneeText =\n        await miro.board.createText({\n\n          content:\n            escapeHtml(\n              jira.assignee\n            ),\n\n          x:\n            x + 62,\n\n          y:\n            y + 42,\n\n          width:\n            160,\n\n          style: {\n\n            color:\n              "#1A1A1A",\n\n            fillColor:\n              "transparent",\n\n            fontFamily:\n              "arial",\n\n            fontSize:\n              10,\n\n            textAlign:\n              "right"\n\n          }\n\n        });\n\n\n      createdItems.push(\n        assigneeText\n      );\n\n\n      group =\n        await miro.board.group({\n\n          items:\n            createdItems\n\n        });\n\n\n      try {\n\n        const boardInfo =\n          await miro.board.getInfo();\n\n\n        const registrationResponse =\n          await backendPost(\n\n            "/register-custom-cards",\n\n            {\n\n              boardId:\n                boardInfo.id,\n\n              cards: [\n\n                {\n                  issueKey:\n                    jira.issueKey,\n\n                  groupId:\n                    String(\n                      group.id\n                    )\n                }\n\n              ]\n\n            }\n\n          );\n\n\n        if (\n          !registrationResponse.ok\n        ) {\n\n          console.warn(\n            "CUSTOM CARD STICKY CONVERSION: grouped card mapping registration failed",\n            await registrationResponse.text()\n          );\n\n        }\n\n\n      } catch (\n        registrationError\n      ) {\n\n        console.warn(\n          "CUSTOM CARD STICKY CONVERSION: grouped card mapping registration failed",\n          registrationError\n        );\n\n      }\n\n\n      return {\n\n        frame:\n          group,\n\n        items:\n          createdItems\n\n      };\n\n\n    } catch (\n      error\n    ) {\n\n      console.error(\n        "CUSTOM CARD STICKY CONVERSION: grouped card creation failed, cleaning up",\n        error\n      );\n\n\n      if (\n        group\n      ) {\n\n        try {\n          await group.ungroup();\n        } catch {}\n\n      }\n\n\n      for (\n        const item\n        of createdItems\n      ) {\n\n        try {\n\n          await miro.board.remove(\n            item\n          );\n\n        } catch {}\n\n      }\n\n\n      throw error;\n\n    }\n\n  }\n\n\n  // ========================================================\n  // STICKY -> CUSTOM CARD POSITION'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one createCustomCardAt block, got {count}')

          # 2) Include groups in startup discovery so their KV mapping is refreshed.
          old = '''      const customContainers = [\n        ...frames,\n        ...appCards\n      ];'''
          new = '''      const groups =\n        await miro.board.get({\n          type:\n            "group"\n        });\n\n\n      const customContainers = [\n        ...frames,\n        ...appCards,\n        ...groups\n      ];'''
          if old not in text:
              raise SystemExit('Missing customContainers block')
          text = text.replace(old, new, 1)

          old = '''        const snapshot =\n          container.type === "app_card"\n            ? await customSyncGetAppCardSnapshot(\n                String(\n                  container.id\n                )\n              )\n            : await customSyncGetFrameSnapshot(\n                String(\n                  container.id\n                )\n              );'''
          new = '''        const snapshot =\n          container.type === "app_card"\n            ? await customSyncGetAppCardSnapshot(\n                String(\n                  container.id\n                )\n              )\n            : container.type === "group"\n              ? await customSyncGetLegacyGroupSnapshot(\n                  String(\n                    container.id\n                  )\n                )\n              : await customSyncGetFrameSnapshot(\n                  String(\n                    container.id\n                  )\n                );'''
          if old not in text:
              raise SystemExit('Missing custom snapshot dispatch block')
          text = text.replace(old, new, 1)

          # 3) Make Jira -> Miro group movement parallel instead of sequential.
          pattern = re.compile(
              r'''        for \(\n          const item\n          of childItems\n        \) \{.*?\n        \}\n\n\n        return \{\n\n          ok:\n            true,\n\n          mapped:\n            true,\n\n          moved:\n            true,''',
              re.S,
          )
          replacement = '''        const moveResults =\n          await Promise.all(\n\n            childItems.map(\n              async item => {\n\n                const itemX =\n                  item.position?.x;\n\n                const itemY =\n                  item.position?.y;\n\n\n                if (\n                  typeof itemX !== "number" ||\n                  typeof itemY !== "number"\n                ) {\n\n                  return {\n                    ok: false,\n                    itemId: String(item.id),\n                    reason: "invalid-geometry"\n                  };\n\n                }\n\n\n                const response =\n                  await patchMiroItemPosition(\n\n                    String(\n                      item.id\n                    ),\n\n                    itemX + deltaX,\n\n                    itemY\n\n                  );\n\n\n                return {\n                  ok: response.ok,\n                  itemId: String(item.id),\n                  status: response.status,\n                  error: response.ok ? null : await response.text()\n                };\n\n              }\n            )\n\n          );\n\n\n        const failedMove =\n          moveResults.find(\n            result =>\n              !result.ok\n          );\n\n\n        if (\n          failedMove\n        ) {\n\n          return {\n\n            ok:\n              false,\n\n            stage:\n              "custom-group-parallel-move",\n\n            itemId:\n              failedMove.itemId,\n\n            miroStatus:\n              failedMove.status ?? null,\n\n            error:\n              failedMove.error ?? failedMove.reason\n\n          };\n\n        }\n\n\n        return {\n\n          ok:\n            true,\n\n          mapped:\n            true,\n\n          moved:\n            true,'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one sequential legacy move loop, got {count}')

          text = text.replace(
              '"CUSTOM CARD EXPERIMENT single-item App Card Miro -> Jira status sync ACTIVE"',
              '"CUSTOM CARD EXPERIMENT grouped classic-card Miro -> Jira status sync ACTIVE"',
              1,
          )
          text = text.replace(
              '"CUSTOM CARD EXPERIMENT Jira -> Miro single-item movement ACTIVE"',
              '"CUSTOM CARD EXPERIMENT Jira -> Miro grouped-card movement ACTIVE"',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check src/worker.js

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/group-card-migration-once.yml
          git add src/worker.js .github/workflows/group-card-migration-once.yml
          git commit -m "Use grouped classic design for new custom cards"
          git push origin HEAD:fix/custom-card-single-item
